        <title>Portal Page</title> <!-- The title of the page that appears in the browser tab -->

    </head>

        <header>
            <nav>
                <a href="https://www.byui.edu" target="_blank">My University</a> <!-- target="_blank" opens the link in a new tab -->

        <main>

        </main>
        <footer>
            <p>What a wonderful webpage!</p>
